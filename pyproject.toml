[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "video-notes-agent"
version = "0.1.0"
description = "Local-first video note-taking engine for AI agents and humans."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Video Notes Agent contributors" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Education",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Video",
  "Topic :: Office/Business :: Office Suites",
]
dependencies = [
  "faster-whisper>=1.0",
  "imageio-ffmpeg>=0.4",
  "pillow>=10",
  "python-docx>=1.1",
]

[project.optional-dependencies]
download = ["yt-dlp>=2025.1.1"]
ocr = ["pytesseract>=0.3"]
render = ["pdf2image>=1.17"]
mcp = ["mcp>=1.12"]
dev = ["build>=1.2", "pytest>=8", "ruff>=0.5", "twine>=5"]

[project.urls]
Homepage = "https://github.com/BerdanLabs/video-notes-agent"
Repository = "https://github.com/BerdanLabs/video-notes-agent"
Issues = "https://github.com/BerdanLabs/video-notes-agent/issues"

[project.scripts]
video-notes = "video_notes.cli:main"
video-notes-mcp = "video_notes.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
