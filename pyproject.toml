[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "video-notes-agent"
version = "0.1.0"
description = "Local-first video note-taking engine for AI agents and humans."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Video Notes Agent contributors" }]
dependencies = [
  "faster-whisper>=1.0",
  "imageio-ffmpeg>=0.4",
  "pillow>=10",
  "python-docx>=1.1",
  "requests>=2.31",
]

[project.optional-dependencies]
download = ["yt-dlp>=2025.1.1"]
ocr = ["pytesseract>=0.3"]
render = ["pdf2image>=1.17"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
video-notes = "video_notes.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
